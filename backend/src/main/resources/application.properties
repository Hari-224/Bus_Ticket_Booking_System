spring.application.name=bus-ticket-booking
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Common JPA
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# JWT
jwt.secret=BusTicketBookingSecretKeyForJWTAuthenticationMustBe256BitsLongForHS256Algorithm2024
jwt.expiration=86400000

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.busticket=DEBUG

# Custom configs
seat.lock.expiry.minutes=5
schedule.days.ahead=7

# AI & RAG Configuration (LangChain4j + Groq + ChromaDB)
groq.api.key=${GROQ_API_KEY:gsk_demo_key_placeholder}
groq.model.name=${GROQ_MODEL_NAME:llama-3.3-70b-versatile}
groq.base-url=https://api.groq.com/openai/v1
chromadb.url=${CHROMADB_URL:http://localhost:8000}
chromadb.collection-name=bus-policy-embeddings
rag.max-results=4
rag.min-score=0.5